# Pages CMS — nie edytujesz tego pliku na co dzień.
# Panel: https://app.pagescms.org  (logowanie GitHubem)

media:
  - name: images
    label: Zdjęcia
    input: public/images
    output: /images
    categories: [image]
    rename: safe

components:
  education:
    type: object
    list:
      collapsible:
        collapsed: true
        summary: "{institution} ({period})"
    fields:
      - { name: period, label: Okres, type: string }
      - { name: institution, label: Uczelnia / szkoła, type: string }
      - { name: degree, label: Stopień / dyplom, type: string }
      - { name: specialization, label: Kierunek / klasa, type: string }
      - name: highlights
        label: Wyróżnienia
        type: string
        list: true

settings:
  content:
    merge: true
  commit:
    identity: user
    templates:
      create: "treść: dodaj {path}"
      update: "treść: aktualizuj {path}"
      delete: "treść: usuń {path}"
      rename: "treść: zmień {oldPath} → {newPath}"

content:
  - name: home
    label: Strona główna
    type: file
    path: src/data/home.json
    format: json
    operations: { create: false, rename: false, delete: false }
    fields:
      - { name: heroName, label: Imię i nazwisko, type: string }
      - { name: heroRole, label: Tytuł pod imieniem, type: string }
      - { name: heroIntro, label: Krótki opis pod tytułem, type: text }
      - name: heroImage
        label: Zdjęcie główne
        type: image
        options: { media: images, path: "" }
      - name: credentials
        label: Cztery liczby na stronie głównej
        type: object
        list:
          collapsible:
            collapsed: false
            summary: "{value} — {label}"
        fields:
          - { name: value, label: Liczba (np. 300+), type: string }
          - { name: label, label: Podpis, type: string }
      - name: directory
        label: Trzy kafelki „Domeny”
        type: object
        list:
          collapsible:
            collapsed: true
            summary: "{index} {title}"
        fields:
          - { name: index, label: Numer (01), type: string }
          - { name: category, label: Mała etykieta, type: string }
          - { name: title, label: Tytuł kafelka, type: string }
          - { name: link, label: Adres (np. /bio), type: string }
          - name: image
            label: Zdjęcie kafelka
            type: image
          - { name: imageAlt, label: Opis zdjęcia, type: string }
      - { name: contactEmail, label: E-mail, type: string }
      - { name: contactInvitation, label: Tekst zaproszenia w stopce, type: text }
      - { name: githubUrl, label: Link GitHub, type: string }
      - { name: youtubeUrl, label: Link YouTube, type: string }

  - name: bio
    label: Bio
    type: file
    path: src/data/bio.json
    format: json
    operations: { create: false, rename: false, delete: false }
    fields:
      - { name: bioTitle, label: Tytuł strony, type: string }
      - { name: bioSubtitle, label: Podtytuł, type: text }
      - { name: bioHeadline, label: Nagłówek biogramu, type: string }
      - { name: bioLeadText, label: Pierwszy akapit, type: text }
      - { name: bioSecondaryText, label: Drugi akapit, type: text }
      - { name: stageText, label: Akapit o działalności scenicznej, type: text }
      - name: currentRoles
        label: Aktualne stanowiska
        type: object
        list:
          collapsible:
            collapsed: false
            summary: "{title}"
        fields:
          - { name: title, label: Zespół / instytucja, type: string }
          - { name: detail, label: Rola i lata, type: string }
      - name: bioStageImage
        label: Zdjęcie przy biogramie
        type: image
      - { name: bioStageCaption, label: Podpis pod zdjęciem scenicznym, type: string }
      - name: bioScoreImage
        label: Zdjęcie partytury
        type: image
      - { name: bioScoreCaption, label: Podpis pod partyturą, type: string }
      - name: higherEducation
        label: Studia (UWM)
        component: education
      - name: musicSchoolEducation
        label: Szkoła muzyczna (PSM)
        component: education
      - name: individualAwards
        label: Nagrody
        type: object
        list:
          collapsible:
            collapsed: true
            summary: "{year} — {title}"
        fields:
          - { name: year, label: Rok, type: string }
          - { name: title, label: Nazwa, type: string }
          - { name: issuer, label: Kto przyznał, type: string }
      - name: mainInstruments
        label: Główne dyscypliny
        type: object
        list:
          collapsible:
            collapsed: true
            summary: "{name}"
        fields:
          - { name: name, label: Nazwa, type: string }
          - { name: category, label: Kategoria, type: string }
          - { name: desc, label: Opis, type: text }
      - name: additionalInstruments
        label: Instrumenty dodatkowe
        type: object
        list:
          collapsible:
            collapsed: true
            summary: "{name}"
        fields:
          - { name: name, label: Nazwa, type: string }
          - { name: desc, label: Opis, type: text }

  - name: ensembles
    label: Formacje
    type: collection
    path: src/content/ensembles
    format: yaml-frontmatter
    filename: "{primary}.md"
    exclude: ["README.md"]
    subfolders: false
    view:
      primary: name
      fields: [name, pillar, years]
      default: { sort: order, order: asc }
    fields:
      - { name: name, label: Nazwa, type: string }
      - name: pillar
        label: Grupa na diagramie
        type: select
        options:
          values:
            - { name: orkiestry, label: Orkiestry }
            - { name: chory, label: Chóry }
            - { name: teatr, label: Teatr }
            - { name: estrada, label: Estrada }
      - { name: role, label: Twoja rola, type: string }
      - { name: years, label: Lata, type: string }
      - { name: concertCount, label: Liczba koncertów (tekst), type: string }
      - { name: order, label: Kolejność (1 = wyżej), type: number }
      - name: highlights
        label: Osiągnięcia (kolejne punkty)
        type: string
        list: true
      - name: photos
        label: Zdjęcia
        type: image
        options:
          media: images
          path: ensembles
          multiple: true
      - name: body
        label: Dłuższy opis
        type: rich-text
        options: { format: markdown, media: false }

  - name: works
    label: Projekty
    type: collection
    path: src/content/works
    format: yaml-frontmatter
    filename: "{primary}.md"
    exclude: ["README.md"]
    subfolders: false
    view:
      primary: title
      fields: [title, year]
      default: { sort: order, order: asc }
    fields:
      - { name: title, label: Tytuł, type: string }
      - { name: subtitle, label: Podtytuł, type: string }
      - name: type
        label: Rodzaj
        type: select
        options:
          values:
            - { name: conducting, label: Dyrygentura }
            - { name: production, label: Produkcja }
      - { name: year, label: Rok, type: string }
      - { name: description, label: Krótki opis, type: text }
      - name: cover
        label: Okładka
        type: image
        options: { media: images, path: works }
      - { name: videoUrl, label: Link do wideo (może być pusty), type: string }
      - { name: order, label: Kolejność (1 = wyżej), type: number }
      - name: metrics
        label: Metryka (tabelka z boku)
        type: object
        list:
          collapsible:
            collapsed: false
            summary: "{label}: {value}"
        fields:
          - { name: label, label: Etykieta, type: string }
          - { name: value, label: Wartość, type: string }
          - { name: url, label: Link (opcjonalny), type: string }
      - name: youtubeVideos
        label: Filmy YouTube
        type: object
        list:
          collapsible:
            collapsed: false
            summary: "{title}"
        fields:
          - { name: title, label: Tytuł, type: string }
          - { name: youtubeId, label: ID z YouTube (to po v=), type: string }
      - { name: videoHeading, label: Nagłówek nad filmami, type: string }
      - name: body
        label: Dłuższy opis
        type: rich-text
        options: { format: markdown, media: false }
