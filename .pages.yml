# Pages CMS — panel: https://app.pagescms.org

media:
  input: public/images
  output: /images
  categories: [image]
  rename: safe

components:
  education:
    type: object
    list: true
    fields:
      - { name: period, label: Okres, type: string }
      - { name: institution, label: Uczelnia / szkoła, type: string }
      - { name: degree, label: Stopień / dyplom, type: string }
      - { name: specialization, label: Kierunek / klasa, type: string }
      - name: highlights
        label: Wyróżnienia
        type: string
        list: true

settings:
  commit:
    identity: user
    templates:
      create: "treść: dodaj {path}"
      update: "treść: aktualizuj {path}"
      delete: "treść: usuń {path}"
      rename: "treść: zmień {oldPath} -> {newPath}"

content:
  - name: home
    label: Strona główna
    type: file
    path: src/data/home.json
    format: json
    operations: { create: false, rename: false, delete: false }
    fields:
      - { name: heroName, label: Imię i nazwisko, type: string }
      - { name: heroRole, label: Tytuł artystyczny, type: string }
      - { name: heroIntro, label: Krótkie wprowadzenie, type: text }
      - name: heroImage
        label: Zdjęcie główne (Hero)
        type: image
      - name: credentials
        label: Wskaźniki dorobku
        type: object
        list: true
        fields:
          - { name: value, label: Wartość (np. 300+), type: string }
          - { name: label, label: Podpis wskaźnika, type: string }
      - name: directory
        label: Kafelki nawigacji
        type: object
        list: true
        fields:
          - { name: index, label: Numeracja (np. 01), type: string }
          - { name: category, label: Kategoria, type: string }
          - { name: title, label: Tytuł kafelka, type: string }
          - { name: link, label: Adres docelowy (np. /bio), type: string }
          - name: image
            label: Zdjęcie kafelka
            type: image
          - { name: imageAlt, label: Tekst alternatywny zdjęcia, type: string }
      - { name: contactEmail, label: Adres e-mail, type: string }
      - { name: contactInvitation, label: Tekst zaproszenia do kontaktu, type: text }
      - { name: githubUrl, label: Link do profilu GitHub, type: string }
      - { name: youtubeUrl, label: Link do kanału YouTube, type: string }

  - name: bio
    label: Bio
    type: file
    path: src/data/bio.json
    format: json
    operations: { create: false, rename: false, delete: false }
    fields:
      - { name: bioTitle, label: Tytuł strony, type: string }
      - { name: bioSubtitle, label: Podtytuł, type: text }
      - { name: bioHeadline, label: Nagłówek biogramu, type: string }
      - { name: bioLeadText, label: Wprowadzenie biogramu, type: text }
      - { name: bioSecondaryText, label: Rozwinięcie biogramu, type: text }
      - { name: stageText, label: Działalność sceniczna, type: text }
      - name: currentRoles
        label: Aktualne stanowiska i role
        type: object
        list: true
        fields:
          - { name: title, label: Zespół / Instytucja, type: string }
          - { name: detail, label: Stanowisko i lata, type: string }
      - name: bioStageImage
        label: Fotografia sceniczna
        type: image
      - { name: bioStageCaption, label: Podpis fotografii scenicznej, type: string }
      - name: bioScoreImage
        label: Fotografia partytury
        type: image
      - { name: bioScoreCaption, label: Podpis fotografii partytury, type: string }
      - name: higherEducation
        label: Szkolnictwo wyższe (UWM)
        component: education
      - name: musicSchoolEducation
        label: Szkoła muzyczna (PSM)
        component: education
      - name: individualAwards
        label: Nagrody i wyróżnienia
        type: object
        list: true
        fields:
          - { name: year, label: Rok, type: string }
          - { name: title, label: Nazwa nagrody, type: string }
          - { name: issuer, label: Instytucja przyznająca, type: string }
      - name: mainInstruments
        label: Główne dyscypliny i instrumentarium
        type: object
        list: true
        fields:
          - { name: name, label: Nazwa instrumentu / dyscypliny, type: string }
          - { name: category, label: Kategoria, type: string }
          - { name: desc, label: Opis, type: text }
      - name: additionalInstruments
        label: Instrumentarium dodatkowe
        type: object
        list: true
        fields:
          - { name: name, label: Nazwa instrumentu, type: string }
          - { name: desc, label: Opis, type: text }

  - name: ensembles
    label: Formacje
    type: collection
    path: src/content/ensembles
    format: yaml-frontmatter
    filename: "{primary}.md"
    exclude: ["README.md"]
    subfolders: false
    view:
      primary: name
      fields: [name, years]
      sort: [name]
      search: [name, role]
    fields:
      - { name: name, label: Nazwa formacji, type: string }
      - name: pillar
        label: Kategoria w diagramie
        type: select
        options:
          values:
            - { value: orkiestry, label: Orkiestry }
            - { value: chory, label: Chóry }
            - { value: teatr, label: Teatr }
            - { value: estrada, label: Estrada }
      - { name: role, label: Pełniona rola, type: string }
      - { name: years, label: Lata działalności, type: string }
      - { name: concertCount, label: Liczba występów (np. 40+ koncertów), type: string }
      - { name: order, label: Kolejność sortowania (1 = najwyżej), type: number }
      - name: highlights
        label: Kluczowe osiągnięcia
        type: string
        list: true
      - name: photos
        label: Fotografie archiwalne
        type: image
        options:
          path: public/images/ensembles
          multiple:
            max: 24
      - name: body
        label: Opis szczegółowy
        type: rich-text

  - name: works
    label: Projekty
    type: collection
    path: src/content/works
    format: yaml-frontmatter
    filename: "{primary}.md"
    exclude: ["README.md"]
    subfolders: false
    view:
      primary: title
      fields: [title, year]
      sort: [title]
      search: [title, subtitle]
    fields:
      - { name: title, label: Tytuł dzieła, type: string }
      - { name: subtitle, label: Podtytuł, type: string }
      - name: type
        label: Rodzaj projektu
        type: select
        options:
          values:
            - { value: conducting, label: Dyrygentura }
            - { value: production, label: Produkcja }
      - { name: year, label: Rok realizacji, type: string }
      - { name: description, label: Opis projektu, type: text }
      - name: cover
        label: Okładka projektu
        type: image
        options:
          path: public/images/works
      - { name: videoUrl, label: Link zewnętrzny do wideo, type: string }
      - { name: order, label: Kolejność sortowania (1 = najwyżej), type: number }
      - name: metrics
        label: Metryka projektu
        type: object
        list: true
        fields:
          - { name: label, label: Etykieta parametru, type: string }
          - { name: value, label: Wartość, type: string }
          - { name: url, label: Link opcjonalny, type: string }
      - name: youtubeVideos
        label: Nagrania YouTube
        type: object
        list: true
        fields:
          - { name: title, label: Tytuł nagrania, type: string }
          - { name: youtubeId, label: Identyfikator wideo YouTube (np. v=ID), type: string }
      - { name: videoHeading, label: Nagłówek sekcji wideo, type: string }
      - name: body
        label: Opis szczegółowy
        type: rich-text
