<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="100%" height="100%">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#09090b" />
      <stop offset="50%" stop-color="#18181b" />
      <stop offset="100%" stop-color="#09090b" />
    </linearGradient>
    <radialGradient id="glow" cx="50%" cy="40%" r="60%">
      <stop offset="0%" stop-color="#f97316" stop-opacity="0.35" />
      <stop offset="70%" stop-color="#c2410c" stop-opacity="0.08" />
      <stop offset="100%" stop-color="#000000" stop-opacity="0" />
    </radialGradient>
    <pattern id="grid" width="30" height="30" patternUnits="userSpaceOnUse">
      <path d="M 30 0 L 0 0 0 30" fill="none" stroke="rgba(255,255,255,0.03)" stroke-width="1"/>
    </pattern>
  </defs>
  
  <rect width="100%" height="100%" fill="url(#bg)"/>
  <rect width="100%" height="100%" fill="url(#grid)"/>
  <circle cx="400" cy="200" r="280" fill="url(#glow)"/>
  
  <!-- Stage light cones -->
  <polygon points="400,0 250,500 550,500" fill="#f97316" opacity="0.04"/>
  <polygon points="200,0 50,500 350,500" fill="#c2410c" opacity="0.03"/>
  <polygon points="600,0 450,500 750,500" fill="#f97316" opacity="0.03"/>

  <!-- Soundwave/Score lines -->
  <g stroke="#f97316" stroke-opacity="0.25" stroke-width="1.5" fill="none">
    <path d="M 50 320 Q 200 280 400 320 T 750 320"/>
    <path d="M 50 340 Q 200 300 400 340 T 750 340"/>
    <path d="M 50 360 Q 200 320 400 360 T 750 360"/>
    <path d="M 50 380 Q 200 340 400 380 T 750 380"/>
    <path d="M 50 400 Q 200 360 400 400 T 750 400"/>
  </g>

  <!-- Central Icon Badge -->
  <circle cx="400" cy="180" r="64" fill="#18181b" stroke="#f97316" stroke-width="2" stroke-opacity="0.6"/>
  <circle cx="400" cy="180" r="54" fill="#27272a" opacity="0.8"/>
  <text x="400" y="196" font-size="44" text-anchor="middle" dominant-baseline="central">🎙️</text>

  <!-- Typography -->
  <text x="400" y="295" font-family="'Plus Jakarta Sans', system-ui, sans-serif" font-size="24" font-weight="700" fill="#f4f4f5" text-anchor="middle" letter-spacing="0.5">Standardy Jazzowe & Retro</text>
  <text x="400" y="330" font-family="'Plus Jakarta Sans', system-ui, sans-serif" font-size="14" font-weight="500" fill="#a1a1aa" text-anchor="middle" letter-spacing="1.2">KWARTET „CZTERY GŁOSY” • CLOSE HARMONY</text>

  <!-- Border Frame -->
  <rect x="16" y="16" width="768" height="468" rx="16" fill="none" stroke="rgba(255,255,255,0.08)" stroke-width="1.5"/>
  <rect x="24" y="24" width="752" height="452" rx="12" fill="none" stroke="#f97316" stroke-opacity="0.15" stroke-width="1"/>
</svg>