<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <defs>
    <linearGradient id="azureGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#0284c7"/>
    </linearGradient>
    <linearGradient id="borderGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.6"/>
      <stop offset="100%" stop-color="#0369a1" stop-opacity="0.2"/>
    </linearGradient>
  </defs>
  
  <!-- Background: Deep Ocean 950 -->
  <rect width="100" height="100" rx="24" fill="#070d1a"/>
  
  <!-- Subtle Inner Glow & Border -->
  <rect x="5" y="5" width="90" height="90" rx="19" fill="none" stroke="url(#borderGrad)" stroke-width="2.5"/>
  
  <!-- Monogram KC in Plus Jakarta Sans -->
  <text 
    x="50" 
    y="65" 
    font-family="'Plus Jakarta Sans', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" 
    font-size="42" 
    font-weight="800" 
    letter-spacing="-0.03em"
    fill="url(#azureGrad)" 
    text-anchor="middle"
  >KC</text>
</svg>
