<!doctype html>
<html lang="pl">
  <head>

    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <style>

        display: grid;

        background: #050505;
        color: #f4f4f5;
      }

        max-width: 28rem;

        display: inline-block;
        padding: 0.75rem 1.25rem;

    <main>
      <h1>Edycja treści</h1>
