backend:
  name: github
  repo: kacperczeczot/kacperczeczot.github.io
  branch: main

media_folder: "public/images"
public_folder: "/images"

display_url: "https://kacperczeczot.github.io"
locale: "pl"

collections:
  # ==========================================
  # 1. Konfiguracja Stron Głównych (Teksty i Ustawienia)
  # ==========================================
  - name: "pages_config"
    label: "Strony i Teksty Witryny"
    delete: false
    files:
      # --- STRONA GŁÓWNA ---
      - name: "home"
        label: "Strona Główna (Hero, Wskaźniki, Kontakt)"
        file: "src/data/home.json"
        format: "json"
        fields:
          - label: "Imię i Nazwisko"
            name: "heroName"
            widget: "string"
            default: "Kacper Czeczot"

          - label: "Tytuł / Pozycjonowanie (H2)"
            name: "heroRole"
            widget: "string"
            default: "Dyrygent · Multiinstrumentalista · Aranżer"

          - label: "Wprowadzenie (Akapit pod nagłówkiem)"
            name: "heroIntro"
            widget: "text"

          - label: "Główne zdjęcie portretowe w Hero"
            name: "heroImage"
            widget: "image"
            media_folder: "public/images"
            public_folder: "/images"

          - label: "Podpis pod portretem"
            name: "heroImageCaption"
            widget: "string"
            default: "Dyrygentura · Multiinstrumentalizm · Aranżacja i Dźwięk"

          - label: "Pasek 4 wskaźników dorobku"
            name: "credentials"
            widget: "list"
            fields:
              - { label: "Liczba / Wartość (np. 300+, 6)", name: "value", widget: "string" }
              - { label: "Podpis (np. Występów scenicznych)", name: "label", widget: "string" }

          - label: "E-mail do kontaktu"
            name: "contactEmail"
            widget: "string"
            default: "kacperczeczot7@gmail.com"

          - label: "Zaproszenie do współpracy (Stopka)"
            name: "contactInvitation"
            widget: "string"
            default: "Projekty orkiestrowe, opracowania partytur oraz współpraca koncertowa."

          - label: "Link do profilu GitHub"
            name: "githubUrl"
            widget: "string"
            default: "https://github.com/kacperczeczot"

          - label: "Link do kanału YouTube"
            name: "youtubeUrl"
            widget: "string"
            default: "https://youtube.com"

      # --- PODSTRONA BIO & EDUKACJA ---
      - name: "bio"
        label: "Podstrona Bio (Edukacja, Warsztat, Nagrody)"
        file: "src/data/bio.json"
        format: "json"
        fields:
          - label: "Tytuł strony"
            name: "bioTitle"
            widget: "string"

          - label: "Podtytuł nagłówka"
            name: "bioSubtitle"
            widget: "text"

          - label: "Nagłówek Biogramu"
            name: "bioHeadline"
            widget: "string"

          - label: "Główny tekst biografii"
            name: "bioLeadText"
            widget: "text"

          - label: "Drugi akapit biografii"
            name: "bioSecondaryText"
            widget: "text"

          - label: "Edukacja Wyższa (UWM itp.)"
            name: "higherEducation"
            widget: "list"
            fields:
              - { label: "Okres (np. 2021 – 2025)", name: "period", widget: "string" }
              - { label: "Uczelnia", name: "institution", widget: "string" }
              - { label: "Stopień (np. Licencjat)", name: "degree", widget: "string" }
              - { label: "Kierunek / Specjalizacja", name: "specialization", widget: "string" }
              - label: "Wyróżnienia / Osiągnięcia"
                name: "highlights"
                widget: "list"
                field: { label: "Punkt", name: "item", widget: "string" }

          - label: "Edukacja Muzyczna (Szkoły muzyczne PSM)"
            name: "musicSchoolEducation"
            widget: "list"
            fields:
              - { label: "Okres", name: "period", widget: "string" }
              - { label: "Szkoła", name: "institution", widget: "string" }
              - { label: "Dyplom", name: "degree", widget: "string" }
              - { label: "Wydział / Klasa", name: "specialization", widget: "string" }
              - label: "Wyróżnienia"
                name: "highlights"
                widget: "list"
                field: { label: "Punkt", name: "item", widget: "string" }

          - label: "Nagrody i Wyróżnienia"
            name: "individualAwards"
            widget: "list"
            fields:
              - { label: "Rok", name: "year", widget: "string" }
              - { label: "Nazwa nagrody", name: "title", widget: "string" }
              - { label: "Organizator / Instytucja", name: "issuer", widget: "string" }

          - label: "Instrumentarium i Dyscypliny Główne"
            name: "mainInstruments"
            widget: "list"
            fields:
              - { label: "Instrument / Dyscyplina", name: "name", widget: "string" }
              - { label: "Kategoria", name: "category", widget: "string" }
              - { label: "Opis", name: "desc", widget: "text" }

  # ==========================================
  # 2. Formacje, Orkiestry, Chóry i Zespoły
  # ==========================================
  - name: "ensembles"
    label: "Formacje i Zespoły"
    label_singular: "Formacja"
    folder: "src/content/ensembles"
    create: true
    slug: "{{slug}}"
    format: "frontmatter"
    extension: "md"
    fields:
      - label: "Nazwa formacji"
        name: "name"
        widget: "string"
        hint: "np. Orkiestra GOK w Opinogórze Górnej"

      - label: "Kategoria (Filary działalności)"
        name: "pillar"
        widget: "select"
        options:
          - { label: "Orkiestry", value: "orkiestry" }
          - { label: "Chóry & Zespoły wokalne", value: "chory" }
          - { label: "Scena & Teatr muzyczny", value: "teatr" }
          - { label: "Kameralistyka & Estrada", value: "estrada" }

      - label: "Pełniona rola"
        name: "role"
        widget: "string"
        hint: "np. Główny Dyrygent, Zastępca Kapelmistrza, Kierownik Muzyczny"

      - label: "Okres działalności / Daty występów"
        name: "concertCount"
        widget: "string"
        hint: "np. Grudzień 2025 – obecnie · Inauguracja sezonu 2025/2026"

      - label: "Kolejność wyświetlania"
        name: "order"
        widget: "number"
        value_type: "int"
        default: 1

      - label: "Kluczowe osiągnięcia (Punkty)"
        name: "highlights"
        widget: "list"
        summary: "{{fields.highlight}}"
        field:
          label: "Osiągnięcie / Konkretne wydarzenie"
          name: "highlight"
          widget: "string"

      - label: "Kadry i fotografie archiwalne"
        name: "photos"
        widget: "list"
        summary: "{{fields.photo}}"
        field:
          label: "Wybierz lub przeciągnij zdjęcie"
          name: "photo"
          widget: "image"
          media_folder: "public/images/ensembles"
          public_folder: "/images/ensembles"

      - label: "Opis działalności i charakterystyka aparatu"
        name: "body"
        widget: "markdown"
        required: false

  # ==========================================
  # 3. Dzieła Autorskie, Dyplomowe i Nagrania
  # ==========================================
  - name: "works"
    label: "Dzieła Autorskie & Projekty"
    label_singular: "Projekt"
    folder: "src/content/works"
    create: true
    slug: "{{slug}}"
    format: "frontmatter"
    extension: "md"
    fields:
      - label: "Tytuł projektu"
        name: "title"
        widget: "string"
        hint: "np. Koncert Dyplomowy „Finale”"

      - label: "Podtytuł / Miejsce realizacji"
        name: "subtitle"
        widget: "string"

      - label: "Typ projektu"
        name: "type"
        widget: "select"
        options:
          - { label: "Dyrygentura koncertowa", value: "conducting" }
          - { label: "Produkcja studyjna & Realizacja", value: "production" }

      - label: "Rok realizacji"
        name: "year"
        widget: "string"
        hint: "np. 2025"

      - label: "Krótki opis"
        name: "description"
        widget: "text"

      - label: "Kolejność wyświetlania"
        name: "order"
        widget: "number"
        value_type: "int"
        default: 1

      - label: "Filmy YouTube"
        name: "youtubeVideos"
        widget: "list"
        fields:
          - { label: "Tytuł utworu / nagrania", name: "title", widget: "string" }
          - { label: "ID filmu YouTube (np. Pl-SkRvxxxs z adresu youtube.com/watch?v=...)", name: "youtubeId", widget: "string" }

      - label: "Szczegółowy opis projektu"
        name: "body"
        widget: "markdown"
        required: false
